<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Problema Transporte</title><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0} :root{--bg:#0f1117;--surface:#181c27;--surface2:#1e2336;--border:#2a3050;--accent:#4f8ef7;--accent2:#34d399;--warn:#f59e0b;--danger:#ef4444;--text:#e8ecf5;--muted:#7b87a8;--cost-bg:#1a1f30;--asign-color:#34d399;--oferta-bg:#1a2a3a;--demanda-bg:#1a2a20;--header-bg:#161b28;--locked-overlay:rgba(15,17,23,0.6);--font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;--radius:6px}body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1.5rem}h1{font-family:var(--mono);font-size:1.1rem;font-weight:600;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin-bottom:2rem;display:flex;align-items:center;gap:10px}h1::before{content:'';display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.controls{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap}.btn-sm{font-size:.78rem;padding:5px 11px}.btn{font-family:var(--font);font-size:.82rem;font-weight:600;padding:6px 14px;border-radius:var(--radius);border:1px solid transparent;cursor:pointer;transition:all .15s;letter-spacing:.02em}.btn:active{transform:scale(1.97)}.btn-ghost{background:transparent;color:var(--muted);border-color:var(--border)}.btn-ghost:hover{background:var(--surface2);color:var(--text)}.btn:disabled{opacity:.3;cursor:not-allowed}.btn-resolver{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:var(--accent);font-weight:600;padding:10px 24px;font-size:.9rem}.btn-resolver:hover{background:linear-gradient(135deg,#3a7be0,#20c997);box-shadow:0 4px 12px rgba(79,142,247,.3)}#mensaje{font-family:var(--mono);font-size:.8rem;min-height:22px;margin-bottom:1rem;color:var(--warn round:rgba(79,142,247,.08)}.input-demanda{color:var(--accent2);height:auto;padding:10px 4px}.input-demanda:focus{background:rgba(52,211,153,.08)}td.td-oferta{background:var(--oferta-bg)}td.td-demanda{background:var(--demanda-bg)}td.td-total{background:var(--header-bg);font-family:var(--mono);font-size:.75rem;color:var(--muted);padding:8px}.td-ficticio{background:#1e1a2e!important}.td-ficticio-celda{background:#181520!important}th.th-ficticio{color:var(--warn);background:#1e1a2e;letter-spacing:.06em}.input-nombre{background:transparent;border:none;border-bottom:1px dashed var(--border);color:var(--muted);font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:2px 4px;outline:none;width:100%;cursor:text;transition:border-color .15s,color .15s}.input-nombre:focus{border-color:var(--accent);color:var(--text)}.input-nombre[readonly]{cursor:default;border-bottom-color:transparent}.resolver-section{display:flex;justify-content:center;margin:2rem 0}.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:center;z-index:1000}.modal-content{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;max-width:400px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:slideIn .3s ease-out}@keyframes slideIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}.modal-content h4{font-family:var(--mono);font-size:1rem;font-weight:600;color:var(--accent);margin-bottom:1.5rem;letter-spacing:.06em;text-transform:uppercase}.modal-buttons{display:flex;flex-direction:column;gap:1rem}.resultado-container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;margin-top:2rem;display:none}.resultado-container:not(:empty){display:block}.resultado-content h3{font-family:var(--mono);font-size:1rem;font-weight:600;color:var(--accent);margin-bottom:1.5rem;letter-spacing:.06em;text-transform:uppercase}.resultado-tabla{width:100%;border-collapse:collapse;margin-bottom:1.5rem;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}.resultado-tabla thead{background:var(--header-bg)}.resultado-tabla th{font-family:var(--mono);font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:12px;text-align:left;border-bottom:1px solid var(--border)}.resultado-tabla td{color:var(--text);padding:10px 12px;border-bottom:1px solid rgba(42,48,80,.5);font-family:var(--mono);font-size:.85rem}.resultado-tabla tbody tr:last-child td{border-bottom:none}.resultado-total{background:rgba(79,142,247,.08);border:1px solid rgba(79,142,247,.3);border-radius:var(--radius);padding:1rem;text-align:center;font-family:var(--mono);font-size:1rem;font-weight:600;color:var(--accent2);letter-spacing:.04em}.vogel-penalizaciones{margin-top:2rem;padding:1.5rem;background:rgba(79,142,247,.04);border:1px solid rgba(79,142,247,.2);border-radius:var(--radius)}.vogel-penalizaciones h4{font-family:var(--mono);font-size:.9rem;font-weight:600;color:var(--accent);margin-bottom:1rem;letter-spacing:.06em;text-transform:uppercase}.iteraciones-list{display:flex;flex-direction:column;gap:1rem;max-height:600px;overflow-y:auto;padding-right:.5rem}.iteracion-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}.iter-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;padding-bottom:.75rem;border-bottom:1px solid var(--border)}.iter-header strong{font-family:var(--mono);font-size:.85rem;color:var(--accent);letter-spacing:.04em}.iter-decision{display:inline-block;background:rgba(52,211,153,.15);color:var(--accent2);padding:3px 8px;border-radius:3px;font-family:var(--mono);font-size:.7rem;font-weight:600;text-transform:uppercase}.iter-penalizaciones{display:grid;grid-temp ton class="btn btn-resolver" onclick="resolverAutomatico('vogel')">Vogel</button><button class="btn btn-ghost" onclick="cerrarSelectorMetodo()">Cancelar</button></div></div></div><div id="resultado" class="resultado-container"></div><script>let filas=3,cols=3,desbloqueado=true,nombresOrigen={},nombresDestino={},basesOferta={},basesDemanda={},costos={},asignaciones={},colFicticia=false,filaFicticia=false;function initEstado(){for(let i=1;i<=filas;i++){if(!nombresOrigen[i])nombresOrigen[i]=`Origen ${i}`;if(!basesOferta[i])basesOferta[i]=100}for(let j=1;j<=cols;j++){if(!nombresDestino[j])nombresDestino[j]=`Destino ${j}`;if(!basesDemanda[j])basesDemanda[j]=100}}function crearTh(t,r,c){const e=document.createElement('th');e.textContent=r;if(c)e.className=c;t.appendChild(e)}function construirTabla(){initEstado();verificarFicticio();const t=document.getElementById('tabla');t.innerHTML='';const totalCols=cols+(colFicticia?1:0);const thead=t.createTHead(),r0=thead.insertRow();crearTh(r0,'Orig \ Dest','');for(let j=1;j<=totalCols;j++){const th=document.createElement('th');th.className=j>cols?'th-ficticio':'';if(j>cols)th.textContent='Dest. Ficticio';else{const inp=document.createElement('input');inp.type='text';inp.className='input-nombre';inp.value=nombresDestino[j]||`Destino ${j}`;inp.dataset.tipo='nombre-destino';inp.dataset.col=j;inp.readOnly=!desbloqueado;inp.addEventListener('change',()=>{nombresDestino[j]=inp.value});inp.addEventListener('focus',()=>inp.select());th.appendChild(inp)}r0.appendChild(th)}crearTh(r0,'OFERTA','th-oferta');const tbody=t.createTBody(),totalFilas=filas+(filaFicticia?1:0);for(let i=1;i<=totalFilas;i++){const esFict=i>filas,tr=tbody.insertRow(),tdOrig=tr.insertCell();tdOrig.className='td-origen'+(esFict?' td-ficticio':'');if(esFict)tdOrig.textContent='Orig. Ficticio';else{const inp=document.createElement('input');inp.type='text';inp.className='input-nombre';inp.value=nombresOrigen[i]||`Origen ${i}`;inp.dataset.tipo='nombre-origen';inp.dataset.fila=i;inp.readOnly=!desbloqueado;inp.addEventListener('change',()=>{nombresOrigen[i]=inp.value});inp.addEventListener('focus',()=>inp.select());tdOrig.appendChild(inp)}for(let j=1;j<=totalCols;j++){const esFictCelda=esFict||j>cols,key=`${i}-${j}`,td=tr.insertCell();td.className='td-celda'+(esFictCelda?' td-ficticio-celda':'');const inner=document.createElement('div');inner.className='celda-inner';const inputCosto=document.createElement('input');inputCosto.type='text';inputCosto.className='input-costo';inputCosto.placeholder='costo';inputCosto.value=esFictCelda?'0':(costos[key]??'0');inputCosto.dataset.tipo='costo';inputCosto.dataset.fila=i;inputCosto.dataset.col=j;inputCosto.readOnly=!desbloqueado||esFictCelda;if(esFictCelda)inputCosto.style.opacity='.3';inputCosto.addEventListener('focus',()=>inputCosto.select());inputCosto.addEventListener('change',()=>{costos[key]=inputCosto.value});const inputAsign=document.createElement('input');inputAsign.type='text';inputAsign.className='input-asign';inputAsign.placeholder='—';inputAsign.value=asignaciones[key]??'';inputAsign.dataset.tipo='asign';inputAsign.dataset.fila=i;inputAsign.dataset.col=j;inputAsign.addEventListener('focus',()=>inputAsign.select());inputAsign.addEventListener('input',()=>{asignaciones[key]=inputAsign.value;recalcular()});inner.appendChild(inputCosto);inner.appendChild(inputAsign);td.appendChild(inner)}const tdOf=tr.insertCell();tdOf.className='td-oferta'+(esFict?' td-ficticio':'');const inpOf=document.createElement('input');inpOf.type='text';inpOf.className='input-oferta';inpOf.dataset.tipo='oferta';inpOf.dataset.fila=i;if(esFict){const exceso=getTotalDemanda()-getTotalOferta();inpOf.value=exceso>0?exceso:0;inpOf.dataset.base=inpOf.value;inpOf.readOnly=true;inpOf.style.opacity='.5'}else{inpOf.value=basesOferta[i]??100;inpOf.dataset.base=inpOf.value;inpOf.readOnly=!desbloqueado;inpOf.addEventListener('focus',()=>inpOf.select());inpOf.addEventListener('change',()=>{basesOferta[i]=parseFloat(inpOf.value)||0;inpOf.dataset.base=basesOferta[i];verificarFicticio();construirTabla()})}tdOf.appendChild(inpOf)}const trDem=tbody.insertRow(),tdDemLabel=trDem.insertCell();tdDemLabel.className='td-origen';tdDemLabel.textContent='DEMANDA';for(let j=1;j<=totalCols;j++){const esFictCol=j>cols,td=trDem.insertCell();td.className='td-demanda'+(esFictCol?' td-ficticio':'');const inp=document.createElement('input');inp.type='text';inp.className='input-demanda';inp.dataset.tipo='demanda';inp.dataset.col=j;if(esFictCol){const exceso=getTotalOferta()-getTotalDemanda();inp.value=exceso>0?exceso:0;inp.dataset.base=inp.value;inp.readOnly=true;inp.style.opacity='.5'}else{inp.value=basesDemanda[j]??100;inp.dataset.base=inp.value;inp.readOnly=!desbloqueado;inp.addEventListener('focus',()=>inp.select());inp.addEventListener('change',()=>{basesDemanda[j]=parseFloat(inp.value)||0;inp.dataset.base=basesDemanda[j];verificarFicticio();construirTabla()})}td.appendChild(inp)}const tdTotal=trDem.insertCell();tdTotal.className='td-total';tdTotal.textContent='—';recalcular()}function getTotalOferta(){let s=0;for(let i=1;i<=filas;i++)s+=basesOferta[i]||0;return s}function getTotalDemanda(){let s=0;for(let j=1;j<=cols;j++)s+=basesDemanda[j]||0;return s}function verificarFicticio(){const sumOf=getTotalOferta(),sumDem=getTotalDemanda(),diff=sumOf-sumDem;colFicticia=diff>0;filaFicticia=diff<0;if(diff>0)setMensaje(`Oferta (${sumOf}) > Demanda (${sumDem}). Se agrega Destino Ficticio con demanda ${diff}.`,'warn');else if(diff<0)setMensaje(`Demanda (${sumDem}) > Oferta (${sumOf}). Se agrega Origen Ficticio con oferta ${Math.abs(diff)}.`,'warn');else setMensaje('Problema equilibrado.','ok')}function recalcular(){const totalCols=cols+(colFicticia?1:0),totalFilas=filas+(filaFicticia?1:0);for(let i=1;i<=totalFilas;i++){const inpOf=document.querySelector(`#tabla input[data-tipo="oferta"][data-fila="${i}"]`);if(!inpOf)continue;const base=parseFloat(inpOf.dataset.base)||0;let usado=0;for(let j=1;j<=totalCols;j++){const a=document.querySelector(`#tabla input[data-tipo="asign"][data-fila="${i}"][data-col="${j}"]`);usado+=parseFloat(a?.value)||0}const rest=base-usado;inpOf.value=rest;inpOf.style.color=rest<0?'var(--danger)':rest===0?'var(--accent2)':'var(--accent)'}for(let j=1;j<=totalCols;j++){const inpDem=document.querySelector(`#tabla input[data-tipo="demanda"][data-col="${j}"]`);if(!inpDem)continue;const base=parseFloat(inpDem.dataset.base)||0;let usado=0;for(let i=1;i<=totalFilas;i++){const a=document.querySelector(`#tabla input[data-tipo="asign"][data-fila="${i}"][data-col="${j}"]`);usado+=parseFloat(a?.value)||0}const rest=base-usado;inpDem.value=rest;inpDem.style.color=rest<0?'var(--danger)':rest===0?'var(--accent2)':'var(--accent2)'}}function addFila(){if(!desbloqueado)return;filas++;nombresOrigen[filas]=`Origen ${filas}`;basesOferta[filas]=100;verificarFicticio();construirTabla()}function remFila(){if(!desbloqueado||filas<=2)return;delete nombresOrigen[filas];delete basesOferta[filas];filas--;verificarFicticio();construirTabla()}function addCol(){if(!desbloqueado)return;cols++;nombresDestino[cols]=`Destino ${cols}`;basesDemanda[cols]=100;verificarFicticio();construirTabla()}function remCol(){if(!desbloqueado||cols<=2)return;delete nombresDestino[cols];delete basesDemanda[cols];cols--;verificarFicticio();construirTabla()}function reiniciar(){if(!desbloqueado)return;filas=3;cols=3;nombresOrigen={};nombresDestino={};basesOferta={};basesDemanda={};costos={};asignaciones={};colFicticia=false;filaFicticia=false;construirTabla();setMensaje('Tabla reiniciada.','ok')}function setMensaje(t,p){const e=document.getElementById('mensaje');e.textContent=t;e.className=p||''}function abrirSelectorMetodo(){document.getElementById('modalMetodo').style.display='flex'}function cerrarSelectorMetodo(){document.getElementById('modalMetodo').style.display='none'}function resolverAutomatico(m){cerrarSelectorMetodo();if(m==='noroeste')resolverEsquinaNoreste();else if(m==='costo-minimo')resolverCostoMinimo();else if(m==='vogel')resolverVogel()}function mostrarResultado(c,m=''){const r=document.getElementById('resultado'),totalFilas=filas+(filaFicticia?1:0),totalCols=cols+(colFicticia?1:0);let h=`<div class="resultado-content"><h3>Resultado Final${m?` - ${m}`:''}</h3><table class="resultado-tabla"><thead><tr><th>Origen</th><th>Destino</th><th>Cantidad</th><th>Costo Unitario</th><th>Costo Total</th></tr></thead><tbody>`;let g=0;for(let i=1;i<=totalFilas;i++)for(let j=1;j<=totalCols;j++){const a=parseFloat(document.querySelector(`#tabla input[data-tipo="asign"][data-fila="${i}"][data-col="${j}"]`)?.value)||0;if(a>0){const co=parseFloat(document.querySelector(`#tabla input[data-tipo="costo"][data-fila="${i}"][data-col="${j}"]`)?.value)||0;const cf=a*co;g+=cf;let no=nombresOrigen[i],nd=nombresDestino[j];if(i>filas)no='Origen Ficticio';if(j>cols)nd='Destino Ficticio';h+=`<tr><td>${no}</td><td>${nd}</td><td>${a}</td><td>${co}</td><td>${cf}</td></tr>`}}h+=`</tbody></table><div class="resultado-total"><strong>COSTO TOTAL: ${g}</strong></div></div>`;r.innerHTML=h}function mostrarResultadoVogel(c,log){const r=document.getElementById('resultado'),totalFilas=filas+(filaFicticia?1:0),totalCols=cols+(colFicticia?1:0);let h=`<div class="resultado-content"><h3>Resultado Final - Método de Vogel</h3><table class="resultado-tabla"><thead><tr><th>Origen</th><th>Destino</th><th>Cantidad</th><th>Costo Unitario</th><th>Costo Total</th></tr></thead><tbody>`;let g=0;for(let i=1;i<=totalFilas;i++)for(let j=1;j<=totalCols;j++){const a=parseFloat(document.querySelector(`#tabla input[data-tipo="asign"][data-fila="${i}"][data-col="${j}"]`)?.value)||0;if(a>0){const co=parseFloat(document.querySelector(`#tabla input[data-tipo="costo"][data-fila="${i}"][data-col="${j}"]`)?.value)||0;const cf=a*co;g+=cf;let no=nombresOrigen[i],nd=nombresDestino[j];if(i>filas)no='Origen Ficticio';if(j>cols)nd='Destino Ficticio';h+=`<tr><td>${no}</td><td>${nd}</td><td>${a}</td><td>${co}</td><td>${cf}</td></tr>`}}h+=`</tbody></table><div class="resultado-total"><strong>COSTO TOTAL: ${g}</strong></div><div class="vogel-penalizaciones"><h4>Análisis de Penalizaciones por Iteración</h4><div class="iteraciones-list">`;log.forEach(logo=>{h+=`<div class="iteracion-card"><div class="iter-header"><strong>Iteración ${logo.iteracion}</strong><span class="iter-decision">${logo.decisor}</span></div><div class="iter-penalizaciones"><div class="pen-filas"><strong>Penalizaciones Filas:</strong><div class="pen-valores">`;Object.entries(logo.penFilas).forEach(([fil,pen])=>{const ef=parseInt(fil)>filas;const nf=ef?'Origen Ficticio':(nombresOrigen[fil]||`Origen ${fil}`);const hi=logo.decisor==='FILA'&&parseInt(fil)===logo.filaSeleccionada?' highlight':'';h+=`<span class="pen-badge${hi}"><small>${nf}</small>: <strong>${pen.toFixed(2)}</strong></span>`});h+=`</div></div><div class="pen-cols"><strong>Penalizaciones Columnas:</strong><div class="pen-valores">`;Object.entries(logo.penCols).forEach(([col,pen])=>{const ec=parseInt(col)>cols;const nc=ec?'Destino Ficticio':(nombresDestino[col]||`Destino ${col}`);const hi=logo.decisor==='COLUMNA'&&parseInt(col)===logo.colSeleccionada?' highlight':'';h+=`<span class="pen-badge${hi}"><small>${nc}</small>: <strong>${pen.toFixed(2)}</strong></span>`});h+=`</div></div></div><div class="iter-asignacion"><strong>✓ Celda Seleccionada:</strong> ${nombresOrigen[logo.filaSeleccionada]||`Origen ${logo.filaSeleccionada}`} → ${nombresDestino[logo.colSeleccionada]||`Destino ${logo.colSeleccionada}`}<br/><strong>Cantidad:</strong> ${logo.cantidad} | <strong>Costo Unit:</strong> ${logo.costo} | <strong>Subtotal:</strong> ${logo.cantidad*logo.costo}</div></div>`});h+=`</div></div></div>`;r.innerHTML=h}function resolverEsquinaNoreste(){const totalFilas=filas+(filaFicticia?1:0),totalCols=cols+(colFicticia?1:0);for(let i=1;i<=totalFilas;i++)for(let j=1;j<=totalCols;j++){const a=document.querySelector(`#tabla input[data-tipo="asign"][data-fila="${i}"][data-col="${j}"]`);if(a)a.value=''}asignaciones={};const ofertaDisp={},demandaDisp={};for(let i=1;i<=totalFilas;i++){const o=document.querySelector(`#tabla input[data-tipo="oferta"][data-fila="${i}"]`);ofertaDisp[i]=parseFloat(o?.dataset.base)||0}for(let j=1;j<=totalCols;j++){const d=document.querySelector(`#tabla input[data-tipo="demanda"][data-col="${j}"]`);demandaDisp[j]=parseFloat(d?.dataset.base)||0}let costoTotal=0,i=1,j=1;while(i<=totalFilas&&j<=totalCols){const cantidad=Math.min(ofertaDisp[i],demandaDisp[j]);if(cantidad>0){const a=document.querySelector(`#tabla input[data-tipo="asign"][data-fila="${i}"][data-col="${j}"]`);const c=document.querySelector(`#tabla input[data-tipo="costo"][data-fila="${i}"][data-col="${j}"]`);a.value=cantidad;asignaciones[`${i}-${j}`]=cantidad;const costo=parseFloat(c?.value)||0;costoTotal+=cantidad*costo;ofertaDisp[i]-=cantidad;demandaDisp[j]-=cantidad}if(ofertaDisp[i]===0)i++;else j++}recalcular();mostrarResultado(costoTotal,'Esquina Noroeste');setMensaje('Problema resuelto con Esquina Noroeste.','ok')}function resolverCostoMinimo(){const totalFilas=filas+(filaFicticia?1:0),totalCols=cols+(colFicticia?1:0);for(let i=1;i<=totalFilas;i++)for(let j=1;j<=totalCols;j++){const a=document.querySelector(`#tabla input[data-tipo="asign"][data-fila="${i}"][data-col="${j}"]`);if(a)a.value=''}asignaciones={};const ofertaDisp={},demandaDisp={},costosMatriz={};for(let i=1;i<=totalFilas;i++){const o=document.querySelector(`#tabla input[data-tipo="oferta"][data-fila="${i}"]`);ofertaDisp[i]=parseFloat(o?.dataset.base)||0}for(let j=1;j<=totalCols;j++){const d=document.querySelector(`#tabla input[data-tipo="demanda"][data-col="${j}"]`);demandaDisp[j]=parseFloat(d?.dataset.base)||0}for(let i=1;i<=totalFilas;i++)for(let j=1;j<=totalCols;j++){const c=document.querySelector(`#tabla input[data-tipo="costo"][data-fila="${i}"][data-col="${j}"]`);costosMatriz[`${i}-${j}`]=parseFloat(c?.value)||0}let costoTotal=0;const celdas=[];for(let i=1;i<=totalFilas;i++)for(let j=1;j<=totalCols;j++)celdas.push({i,j,costo:costosMatriz[`${i}-${j}`]});while(celdas.length>0&&Object.values(ofertaDisp).some(v=>v>0)){celdas.sort((a,b)=>a.costo-b.costo);const celda=celdas.shift(),i=celda.i,j=celda.j;if(ofertaDisp[i]>0&&demandaDisp[j]>0){const cantidad=Math.min(ofertaDisp[i],demandaDisp[j]);const a=document.querySelector(`#tabla input[data-tipo="asign"][data-fila="${i}"][data-col="${j}"]`);a.value=cantidad;asignaciones[`${i}-${j}`]=cantidad;costoTotal+=cantidad*celda.costo;ofertaDisp[i]-=cantidad;demandaDisp[j]-=cantidad}}recalcular();mostrarResultado(costoTotal,'Costo Mínimo');setMensaje('Problema resuelto con Costo Mínimo.','ok')}function resolverVogel(){const totalFilas=filas+(filaFicticia?1:0),totalCols=cols+(colFicticia?1:0);for(let i=1;i<=totalFilas;i++)for(let j=1;j<=totalCols;j++){const a=document.querySelector(`#tabla input[data-tipo="asign"][data-fila="${i}"][data-col="${j}"]`);if(a)a.value=''}asignaciones={};const ofertaDisp={},demandaDisp={},costosMatriz={};for(let i=1;i<=totalFilas;i++){const o=document.querySelector(`#tabla input[data-tipo="oferta"][data-fila="${i}"]`);ofertaDisp[i]=parseFloat(o?.dataset.base)||0}for(let j=1;j<=totalCols;j++){const d=document.querySelector(`#tabla input[data-tipo="demanda"][data-col="${j}"]`);demandaDisp[j]=parseFloat(d?.dataset.base)||0}for(let i=1;i<=totalFilas;i++)for(let j=1;j<=totalCols;j++){const c=document.querySelector(`#tabla input[data-tipo="costo"][data-fila="${i}"][data-col="${j}"]`);costosMatriz[`${i}-${j}`]=parseFloat(c?.value)||0}const filasActivas=new Set(Array.from({length:totalFilas},(_,i)=>i+1)),colsActivas=new Set(Array.from({length:totalCols},(_,i)=>i+1));let costoTotal=0,log=[];let iter=0;while(filasActivas.size>0&&colsActivas.size>0){iter++;const penFilas=calcularPenalizacionesFilas(filasActivas,colsActivas,costosMatriz),penCols=calcularPenalizacionesCols(filasActivas,colsActivas,costosMatriz),maxPenFila=Math.max(...Object.values(penFilas)),maxPenCol=Math.max(...Object.values(penCols));let filaSel,colSel,decisor='';if(maxPenFila>=maxPenCol){decisor='FILA';filaSel=parseInt(Object.keys(penFilas).find(f=>penFilas[f]===maxPenFila));let min=Infinity;for(const j of colsActivas){const c=costosMatriz[`${filaSel}-${j}`];if(c<min){min=c;colSel=j}}}else{decisor='COLUMNA';colSel=parseInt(Object.keys(penCols).find(c=>penCols[c]===maxPenCol));let min=Infinity;for(const i of filasActivas){const c=costosMatriz[`${i}-${colSel}`];if(c<min){min=c;filaSel=i}}}const cantidad=Math.min(ofertaDisp[filaSel],demandaDisp[colSel]);log.push({iteracion:iter,penFilas:{...penFilas},penCols:{...penCols},maxPenFila,maxPenCol,decisor,filaSeleccionada:filaSel,colSeleccionada:colSel,cantidad,costo:costosMatriz[`${filaSel}-${colSel}`]});if(cantidad>0){const a=document.querySelector(`#tabla input[data-tipo="asign"][data-fila="${filaSel}"][data-col="${colSel}"]`);a.value=cantidad;asignaciones[`${filaSel}-${colSel}`]=cantidad;const costo=costosMatriz[`${filaSel}-${colSel}`];costoTotal+=cantidad*costo;ofertaDisp[filaSel]-=cantidad;demandaDisp[colSel]-=cantidad;if(ofertaDisp[filaSel]===0)filasActivas.delete(filaSel);if(demandaDisp[colSel]===0)colsActivas.delete(colSel)}}recalcular();mostrarResultadoVogel(costoTotal,log);setMensaje('Problema resuelto con Método de Vogel.','ok')}function calcularPenalizacionesFilas(fAct,cAct,cM){const p={};for(const i of fAct){const costs=[];for(const j of cAct)costs.push(cM[`${i}-${j}`]);costs.sort((a,b)=>a-b);p[i]=costs.length>=2?costs[1]-costs[0]:0}return p}function calcularPenalizacionesCols(fAct,cAct,cM){const p={};for(const j of cAct){const costs=[];for(const i of fAct)costs.push(cM[`${i}-${j}`]);costs.sort((a,b)=>a-b);p[j]=costs.length>=2?costs[1]-costs[0]:0}return p}construirTabla();</script></body></html>
