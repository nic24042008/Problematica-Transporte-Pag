<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Método de la Esquina Noroeste</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="transporte-styles.css"/>
</head>
<body>

<h1>Proyecto Problematica de Transporte</h1>

<div class="controls">
  <button class="btn btn-ghost btn-sm" id="btnAddFila"    onclick="addFila()">+ Fila</button>
  <button class="btn btn-ghost btn-sm" id="btnRemFila"    onclick="remFila()">− Fila</button>
  <button class="btn btn-ghost btn-sm" id="btnAddCol"     onclick="addCol()">+ Columna</button>
  <button class="btn btn-ghost btn-sm" id="btnRemCol"     onclick="remCol()">− Columna</button>
  <button class="btn btn-ghost btn-sm" id="btnReiniciar"  onclick="reiniciar()">Reiniciar</button>
</div>

<div id="mensaje"></div>

<div class="tabla-wrap">
  <table id="tabla"></table>
</div>

<div class="resolver-section">
  <button class="btn btn-resolver" onclick="abrirSelectorMetodo()">Resolver</button>
</div>

<div id="modalMetodo" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <h4>Selecciona método de resolución</h4>
    <div class="modal-buttons">
      <button class="btn btn-resolver" onclick="resolverAutomatico('noroeste')">Esquina Noroeste</button>
      <button class="btn btn-resolver" onclick="resolverAutomatico('')">Costo Mínimo</button>
      <button class="btn btn-resolver" onclick="resolverAutomatico('')">Vogel</button>
      <button class="btn btn-ghost" onclick="cerrarSelectorMetodo()">Cancelar</button>
    </div>
  </div>
</div>

<div id="resultado" class="resultado-container"></div>

<script src="transporte-tabla.js"></script>
<script src="transporte-noroeste.js"></script>
<script src="transporte-costo-minimo.js"></script>
<script src="transporte-vogel.js"></script>
</body>
</html>
